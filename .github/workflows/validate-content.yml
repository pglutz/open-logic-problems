name: Validate Content

on:
  pull_request:
    paths: ["problems/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - run: node --experimental-strip-types scripts/content-automation/validate-content.ts
